[package]
name = "cpb-credential-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Writes sealed Custom Endpoint secrets after VS Code exits."

[[bin]]
name = "credential-helper-win32-x64"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.22"
getrandom = "0.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.40.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"

[workspace]
